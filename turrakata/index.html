<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turrakata · Wishlists</title>
  <meta name="description" content="¿Cuánto falta para las 1000 wishlists de Turrakata en Steam?">
  <meta property="og:title" content="Turrakata · Wishlists">
  <meta property="og:description" content="Ayudanos a llegar a 1000 wishlists en Steam.">
  <meta property="og:image" content="https://falsofacu.github.io/turrakata/logo_full.png">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #ffd735;
      --accent-2: #ff9f1c;
      --bg: #0b0b0d;
      --track: rgba(255, 255, 255, .08);
      --text: #f5f3ee;
      --muted: rgba(245, 243, 238, .55);
      --steam: #66c0f4;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(900px 500px at 50% -10%, rgba(255, 215, 53, .14), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 16px 32px;
    }

    main {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: min(300px, 64vw);
      height: auto;
      image-rendering: pixelated;
      filter: drop-shadow(0 16px 40px rgba(255, 215, 53, .18));
    }

    .store {
      width: 100%;
      margin-top: 48px;
      display: grid;
      grid-template-columns: minmax(0, 46fr) minmax(0, 54fr);
      background: linear-gradient(135deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .025));
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
    }

    .store .art {
      display: block;
      position: relative;
      background: #000;
    }

    .store .art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: left center;
      aspect-ratio: 460 / 215;
      transition: transform .4s;
    }

    .store .art:hover img { transform: scale(1.03); }

    .store .info {
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .store h1 {
      margin: 0;
      font-family: "Space Grotesk", "Inter", sans-serif;
      font-size: 26px;
      line-height: 1.1;
    }

    .store .desc {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tags span {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .07);
      color: var(--muted);
    }

    .store .row {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .release {
      font-size: 13px;
      color: var(--muted);
    }

    .release b {
      display: block;
      font-size: 15px;
      color: var(--text);
      font-weight: 600;
    }

    @media (max-width: 640px) {
      .store { grid-template-columns: 1fr; }
      .store .art img { height: auto; }
    }

    .stats {
      width: 100%;
      margin-top: 72px;
      text-align: center;
    }

    .count {
      font-family: "Space Grotesk", "Inter", sans-serif;
      font-weight: 700;
      line-height: .9;
      letter-spacing: -.04em;
      font-variant-numeric: tabular-nums;
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: .08em;
      flex-wrap: wrap;
    }

    .count .now {
      font-size: clamp(88px, 22vw, 200px);
      background: linear-gradient(180deg, #fff3b0, var(--accent) 45%, var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .count .goal {
      font-size: clamp(40px, 9vw, 80px);
      color: var(--muted);
    }

    .unit {
      margin-top: 12px;
      font-size: clamp(16px, 3.4vw, 22px);
      font-weight: 500;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .bar {
      position: relative;
      width: 100%;
      height: 28px;
      margin-top: 48px;
      border-radius: 999px;
      background: var(--track);
      overflow: hidden;
    }

    .fill {
      position: relative;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      box-shadow: 0 0 32px rgba(255, 215, 53, .45);
      transition: width 1.6s cubic-bezier(.2, .8, .2, 1);
      overflow: hidden;
    }

    .fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent);
      transform: translateX(-100%);
      animation: shine 2.8s ease-in-out 1.8s infinite;
    }

    @keyframes shine { to { transform: translateX(100%); } }

    .meta {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .meta .pct { color: var(--text); font-weight: 600; }

    .remaining {
      margin: 40px 0 0;
      font-size: clamp(17px, 3.6vw, 20px);
    }

    .remaining b { color: var(--accent); font-weight: 600; }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 15px;
      color: #111;
      white-space: nowrap;
      background: var(--accent);
      text-decoration: none;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 8px 24px rgba(255, 215, 53, .25);
    }

    .cta:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(255, 215, 53, .35); }
    .cta:focus-visible { outline: 3px solid var(--steam); outline-offset: 3px; }

    .updated {
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }

    footer {
      margin-top: auto;
      padding-top: 48px;
      font-size: 13px;
    }

    footer button {
      font: inherit;
      color: var(--muted);
      background: none;
      border: 0;
      cursor: pointer;
      padding: 0;
    }

    footer button:hover { color: var(--text); }

    @media (prefers-reduced-motion: reduce) {
      .fill { transition: none; }
      .fill::after { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo_full.png" alt="Turrakata" width="1013" height="930">

    <article class="store">
      <a class="art" href="https://store.steampowered.com/app/5218590/" target="_blank" rel="noopener">
        <img id="header" alt="" src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/5218590/6057df016ec12b04b538016019be33cd78c6bbc2/header_spanish.jpg">
      </a>
      <div class="info">
        <h1 id="name">Turrakata</h1>
        <p class="desc" data-i18n="desc"></p>
        <div class="tags" id="tags"></div>
        <div class="row">
          <div class="release"><span data-i18n="releaseLabel">Lanzamiento</span><b id="release"></b></div>
          <a class="cta" href="https://store.steampowered.com/app/5218590/" target="_blank" rel="noopener" data-i18n="cta">Agregar a deseados</a>
        </div>
      </div>
    </article>

    <section class="stats" aria-live="polite">
      <div class="count">
        <span class="now" id="count">0</span><span class="goal">/<span id="goal">1000</span></span>
      </div>
      <div class="unit" data-i18n="unit">wishlists</div>

      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="0" id="bar">
        <div class="fill" id="fill"></div>
      </div>
      <div class="meta"><span class="pct" id="pct">0%</span><span id="remainingShort"></span></div>

      <p class="remaining" id="remaining"></p>
      <p class="updated" id="updated"></p>
    </section>
  </main>

  <footer>
    <button type="button" id="lang">English</button>
  </footer>

  <script>
    const STEAM_ASSETS = "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/5218590/";
    const RELEASE = new Date(2026, 9, 19);

    const STRINGS = {
      es: {
        name: "Turrakata",
        header: STEAM_ASSETS + "6057df016ec12b04b538016019be33cd78c6bbc2/header_spanish.jpg",
        desc: "Supervivencia y crafteo de mundo abierto y shooter 2D en un planeta chiquito. Alguien te robó la gorra y dejó al aire tu fea, repugnante y putrefacta cabeza pelada. Disparar, craftear, construir y expandir para vengarte.",
        tags: ["Acción", "Aventura", "Casual", "Indie"],
        releaseLabel: "Lanzamiento",
        unit: "wishlists",
        cta: "Agregar a deseados",
        left: n => `faltan ${n}`,
        remaining: "¡Sumá la tuya en Steam!",
        reached: "¡Llegamos a la meta! Gracias.",
        updated: d => `Actualizado ${d}`,
        error: "No se pudo cargar el contador.",
        toggle: "English",
      },
      en: {
        name: "Hustle",
        header: STEAM_ASSETS + "2678bcb6ff76cb8173c2d3c469b2b4285e269d45/header.jpg",
        desc: "An open-world survival-crafting game and top-down shooter set on a tiny planet. Someone stole your red cap, exposing your ugly, putrid, bald head. Shoot, gather, craft, build and expand to seek revenge.",
        tags: ["Action", "Adventure", "Casual", "Indie"],
        releaseLabel: "Release",
        unit: "wishlists",
        cta: "Add to wishlist",
        left: n => `${n} to go`,
        remaining: "Add yours on Steam!",
        reached: "Goal reached! Thank you.",
        updated: d => `Updated ${d}`,
        error: "Couldn't load the counter.",
        toggle: "Español",
      },
    };

    // Same rule as the game's LanguageService: Spanish if the browser is, otherwise English.
    let lang = (navigator.language || "en").toLowerCase().startsWith("es") ? "es" : "en";
    try { lang = localStorage.getItem("trk_lang") || lang; } catch (e) {}

    let data = null;
    let counted = false;
    const $ = id => document.getElementById(id);
    const locale = () => (lang === "es" ? "es-UY" : "en-US");
    const fmt = n => n.toLocaleString(locale());

    function applyLang() {
      const s = STRINGS[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = s[el.dataset.i18n];
      });
      $("lang").textContent = s.toggle;
      renderStoreCard();
      if (data) renderText();
    }

    // The store card always shows the Spanish store page, whatever the page language.
    function renderStoreCard() {
      const es = STRINGS.es;
      $("name").textContent = es.name;
      $("header").src = es.header;
      $("header").alt = es.name;
      document.querySelector('.store [data-i18n="desc"]').textContent = es.desc;
      document.querySelector('.store [data-i18n="releaseLabel"]').textContent = es.releaseLabel;
      document.querySelector('.store [data-i18n="cta"]').textContent = es.cta;
      $("tags").replaceChildren(...es.tags.map(t => Object.assign(document.createElement("span"), { textContent: t })));
      $("release").textContent = RELEASE.toLocaleDateString("es-UY", { day: "numeric", month: "long", year: "numeric" });
    }

    function renderText() {
      const s = STRINGS[lang];
      const left = Math.max(0, data.goal - data.wishlists);
      if (counted) $("count").textContent = fmt(data.wishlists);
      $("goal").textContent = fmt(data.goal);
      $("remainingShort").textContent = left > 0 ? s.left(fmt(left)) : "";
      $("remaining").textContent = left > 0 ? s.remaining : s.reached;
      if (data.updated) {
        const hasTime = data.updated.includes("T");
        const d = new Date(hasTime ? data.updated : data.updated + "T12:00:00");
        const opts = { day: "numeric", month: "long", year: "numeric" };
        if (hasTime) Object.assign(opts, { hour: "2-digit", minute: "2-digit" });
        $("updated").textContent = s.updated(d.toLocaleString(locale(), opts));
      }
    }

    function countUp(target) {
      const done = () => { counted = true; $("count").textContent = fmt(target); };
      if (matchMedia("(prefers-reduced-motion: reduce)").matches || target === 0) { done(); return; }
      const start = performance.now();
      const dur = 1600;
      const step = now => {
        const t = Math.min(1, (now - start) / dur);
        $("count").textContent = fmt(Math.round(target * (1 - Math.pow(1 - t, 3))));
        if (t < 1) requestAnimationFrame(step); else done();
      };
      requestAnimationFrame(step);
    }

    async function load() {
      try {
        const res = await fetch("wishlists.json?t=" + Date.now(), { cache: "no-store" });
        const json = await res.json();
        data = {
          wishlists: Math.max(0, Number(json.wishlists) || 0),
          goal: Math.max(1, Number(json.goal) || 1000),
          updated: json.updated || "",
        };
      } catch (e) {
        $("remaining").textContent = STRINGS[lang].error;
        return;
      }

      const pct = Math.min(100, (data.wishlists / data.goal) * 100);
      renderText();
      countUp(data.wishlists);
      $("bar").setAttribute("aria-valuemax", data.goal);
      $("bar").setAttribute("aria-valuenow", data.wishlists);
      $("pct").textContent = Math.floor(pct) + "%";
      requestAnimationFrame(() => { $("fill").style.width = pct + "%"; });
    }

    $("lang").addEventListener("click", () => {
      lang = lang === "es" ? "en" : "es";
      try { localStorage.setItem("trk_lang", lang); } catch (e) {}
      applyLang();
    });

    applyLang();
    load();
  </script>
</body>
</html>
